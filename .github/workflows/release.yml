name: Release

# Builds the mod zip and publishes a GitHub release with it.
# Runs when a version tag (for example v1.2.0.0) is pushed, or by hand from the
# Actions tab ("Run workflow"), which releases the version in modDesc.xml.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Work out the release tag from modDesc.xml
        run: |
          version=$(grep -oP '(?<=<version>)[^<]+' modDesc.xml)
          tag="v$version"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$tag" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match modDesc.xml version $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "TAG=$tag" >> "$GITHUB_ENV"

      - name: Build the mod zip
        run: |
          zip_name="${GITHUB_REPOSITORY#*/}.zip"
          zip -r "$zip_name" modDesc.xml *.dds scripts LICENSE
          echo "ZIP_NAME=$zip_name" >> "$GITHUB_ENV"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" "$ZIP_NAME" \
            --target "$GITHUB_SHA" \
            --title "${GITHUB_REPOSITORY#*/} $VERSION" \
            --notes "Download \`$ZIP_NAME\` below and put it in \`Documents/My Games/FarmingSimulator2025/mods/\` without unzipping it. Keep the file name exactly as it is. See the README for what the mod does."
